name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The gate: the library and both test executables build, no proof is
  # admitted, and every theorem reaches only Lean's three axioms.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with: { test: false, lint: false }
      - name: Verification gate (axioms, sorry/admit, partial, unsafe, implemented_by, extern)
        run: lake env lean --run scripts/Axioms.lean LeanItsdangerous
      - name: Examples (ports of the itsdangerous docs that need no JSON)
        run: lake build Examples
      - name: Property tests
        run: lake exe props
      - name: Conformance
        run: lake exe conformance
      - name: Traceability
        run: python3 scripts/traceability-check.py

  plausible:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with: { test: false, lint: false }
      - name: Build and run the plausible suite
        working-directory: tests/pbt
        run: |
          lake build
          ./.lake/build/bin/pbt

  # The serializer examples with real JSON values: a separate package that
  # requires lean-json, so the core library keeps no dependencies.
  json-examples:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with: { test: false, lint: false }
      - name: Build the JSON examples and check them against itsdangerous 2.2.0
        working-directory: examples/json
        run: |
          lake build
          lake exe check
          lake exe quickstart
