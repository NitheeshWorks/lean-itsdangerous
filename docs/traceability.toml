[[requirement]]
id = "signer.invalid-separator"
upstream = "tests/test_itsdangerous/test_signer.py::TestSigner::test_invalid_separator"
title = "a separator that may occur in a signature is rejected"
status = "deviation"
realises = ["LeanItsdangerous.checkSeparator", "LeanItsdangerous.ValidSep"]
theorem = ["LeanItsdangerous.Signer.rsplit_signWith"]
test = ["tests/Conformance.lean::test_invalid_separator"]
note = "Upstream rejects a separator only when it is a substring of the base64 alphabet; we reject any separator that is empty or contains an alphabet byte. Stricter for multi-byte separators mixing alphabet and other bytes; it is what makes the split provably correct."

