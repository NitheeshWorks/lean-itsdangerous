[[requirement]]
id = "signer.compare"
upstream = "src/itsdangerous/signer.py::SigningAlgorithm.verify_signature"
title = "signature comparison"
status = "deviation"
realises = ["LeanItsdangerous.Signer.verifySignature", "LeanItsdangerous.ctEq"]
theorem = ["LeanItsdangerous.Signer.verifySignature_iff", "LeanItsdangerous.ctEq_iff"]
note = "Upstream base64-decodes the signature and uses hmac.compare_digest. We compare the canonical base64url encoding with ctEq: length check, then an OR of XORs over every byte pair with no early exit (ctEq_iff proves it is equality). Same verdict on every signature upstream emits; rejects non-canonical spellings Python's lenient decoder accepts. Lean gives no timing guarantee for the compiled code."

