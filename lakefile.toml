name = "LeanItsdangerous"
version = "0.1.0"
defaultTargets = ["LeanItsdangerous", "props", "conformance", "quickstart"]

# The verified library. Everything under LeanItsdangerous/ except Transport.lean is a
# total function and the proof surface; see CONTRIBUTING.md.
[[lean_lib]]
name = "LeanItsdangerous"

# Property tests for what is tested rather than proved. No dependencies, runs
# in well under a second: `lake exe props [seed]`.
[[lean_exe]]
name = "props"
root = "tests.Props"

# Conformance cases re-expressed from the upstream test suite:
# `lake exe conformance`. Each case names the upstream test it mirrors.
[[lean_exe]]
name = "conformance"
root = "tests.Conformance"

# The README quickstart, compiled so it cannot drift from the API:
# `lake exe quickstart`.
[[lean_exe]]
name = "quickstart"
root = "examples.Quickstart"
