name = "LeanItsdangerous"
version = "0.1.0"
defaultTargets = ["LeanItsdangerous", "Examples", "props", "conformance"]

# The verified library. Everything under LeanItsdangerous/ except Transport.lean is a
# total function and the proof surface; see CONTRIBUTING.md.
[[lean_lib]]
name = "LeanItsdangerous"

# Property tests for what is tested rather than proved. No dependencies, runs
# in well under a second: `lake exe props [seed]`.
[[lean_exe]]
name = "props"
root = "tests.Props"

# Conformance cases re-expressed from the upstream test suite:
# `lake exe conformance`. Each case names the upstream test it mirrors.
[[lean_exe]]
name = "conformance"
root = "tests.Conformance"

# Ports of the itsdangerous docs pages that need no JSON (see
# examples/MANIFEST.toml); the serializer pages, with real JSON values, are
# the separate package examples/json. `tests/Conformance.lean` checks every
# value these print against upstream itsdangerous 2.2.0.
[[lean_lib]]
name = "Examples"
roots = ["examples.Signer", "examples.Timed"]
