name = "LeanItsdangerous"
version = "0.1.0"
defaultTargets = ["LeanItsdangerous", "Examples", "props", "conformance", "quickstart"]

# The verified library. Everything under LeanItsdangerous/ except Transport.lean is a
# total function and the proof surface; see CONTRIBUTING.md.
[[lean_lib]]
name = "LeanItsdangerous"

# Property tests for what is tested rather than proved. No dependencies, runs
# in well under a second: `lake exe props [seed]`.
[[lean_exe]]
name = "props"
root = "tests.Props"

# Conformance cases re-expressed from the upstream test suite:
# `lake exe conformance`. Each case names the upstream test it mirrors.
[[lean_exe]]
name = "conformance"
root = "tests.Conformance"

# The itsdangerous docs, translated: one module per docs page (see
# examples/README.md). Built with the library; `tests/Conformance.lean` checks
# every value they print against upstream itsdangerous 2.2.0.
[[lean_lib]]
name = "Examples"
roots = ["examples.Quickstart", "examples.Signer", "examples.Timed", "examples.Serializer",
  "examples.UrlSafe", "examples.Concepts", "examples.Exceptions"]

# The README quickstart as a program: `lake exe quickstart`.
[[lean_exe]]
name = "quickstart"
root = "examples.Quickstart"
