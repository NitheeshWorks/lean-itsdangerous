# Every upstream example and its Lean port (checked by
# stack-tools/check-examples.py). itsdangerous ships no example programs, so
# its examples are the Python code blocks of its docs pages and README, one
# Lean file per page. encoding.rst and exceptions.rst are autodoc pages with no
# code block, so they have no port; tests/Conformance.lean covers what they
# document.

[meta]
upstream = "itsdangerous"
doc_pages = ["README.md", "docs/signer.rst", "docs/timed.rst", "docs/serializer.rst",
  "docs/url_safe.rst", "docs/concepts.rst"]
# Not ports: the Codec Json instance, the output check, and the quickstart's
# program entry point.
helpers = ["examples/json/ItsdangerousJson.lean", "examples/json/Check.lean",
  "examples/json/QuickstartMain.lean"]

[[example]]
upstream = "README.md#block-1"
lean = "examples/json/Quickstart.lean"
status = "ported"
reason = ""
output = "examples/json/Check.lean::README.md"

[[example]]
upstream = "docs/signer.rst#block-1"
lean = "examples/Signer.lean"
status = "ported"
reason = ""
output = "tests/Conformance.lean::docs/signer.rst#block-1"

